<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Woven technical architecture</title>
  <desc id="desc">ChatGPT, Codex, the browser fallback, and merchant desk share one Node.js service, SQLite store, domain rules, and simulated payment boundary.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0l10 5.5L0 11z" fill="#83958e"/>
    </marker>
    <marker id="signal-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0l10 5.5L0 11z" fill="#b7f522"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="34" fill="#fcfaf5"/>

  <g transform="translate(72 54)">
    <image href="../brand/woven-mark.svg" width="54" height="54"/>
    <text x="72" y="36" fill="#0e4b3b" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="34" font-weight="600">Woven</text>
    <text x="1277" y="30" fill="#6d7974" font-family="SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.8">SYSTEM ARCHITECTURE</text>
  </g>

  <g transform="translate(72 160)">
    <text fill="#0e4b3b" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="60" font-weight="600" letter-spacing="-2">One service. Every surface. One source of truth.</text>
    <text y="50" fill="#5f6964" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="19">The in-chat MCP App, stage-safe browser transport, and merchant desk share the same rules and SQLite transactions.</text>
  </g>

  <g transform="translate(72 268)">
    <text x="0" y="0" fill="#7b8782" font-family="SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.7">SURFACES</text>

    <g transform="translate(0 32)">
      <rect width="320" height="132" rx="14" fill="#0e4b3b"/>
      <circle cx="38" cy="40" r="17" fill="#b7f522"/>
      <path d="M30 40h16M38 32v16" stroke="#0e4b3b" stroke-width="3" stroke-linecap="round"/>
      <text x="68" y="44" fill="#fff" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="24" font-weight="600">ChatGPT / Codex</text>
      <text x="28" y="82" fill="#c5d0cb" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14">Host model + MCP client</text>
      <text x="28" y="106" fill="#dcece5" font-family="SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">TOOLS ↔ REACT MCP APP WIDGET</text>
    </g>

    <g transform="translate(0 184)">
      <rect width="320" height="110" rx="14" fill="#fff" stroke="#d8d0c4" stroke-width="2"/>
      <text x="28" y="41" fill="#0e4b3b" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="23" font-weight="600">Browser /demo</text>
      <text x="28" y="70" fill="#5f6964" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14">Stage-safe transport; same behavior</text>
      <text x="28" y="92" fill="#8a928e" font-family="SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">NOT A FAKE CHAT UI</text>
    </g>

    <g transform="translate(0 314)">
      <rect width="320" height="110" rx="14" fill="#dcece5" stroke="#9dcfc2" stroke-width="2"/>
      <text x="28" y="41" fill="#0e4b3b" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="23" font-weight="600">Merchant /merchant</text>
      <text x="28" y="70" fill="#5f6964" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14">Stock, price, scenarios, orders, audit</text>
      <text x="28" y="92" fill="#4c7b70" font-family="SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">LIVE DEMO CONTROL PLANE</text>
    </g>

    <line x1="320" y1="98" x2="410" y2="98" stroke="#83958e" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="320" y1="239" x2="410" y2="239" stroke="#83958e" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="320" y1="369" x2="410" y2="369" stroke="#83958e" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(420)">
      <text x="0" y="0" fill="#7b8782" font-family="SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.7">ONE DEPLOYABLE NODE.JS SERVICE</text>
      <rect y="32" width="600" height="424" rx="20" fill="#0e4b3b"/>

      <g transform="translate(28 60)">
        <text fill="#dcece5" font-family="SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.4">01 · TRANSPORT + VALIDATION</text>
        <rect y="22" width="544" height="68" rx="10" fill="#263832"/>
        <text x="20" y="50" fill="#fff" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700">HTTP MCP · stdio MCP · same-origin APIs · Zod</text>
        <text x="20" y="72" fill="#aebdb7" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="12">Six tools with model-visible vs app-only boundaries</text>
      </g>

      <g transform="translate(28 174)">
        <text fill="#d6ff70" font-family="SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.4">02 · COMMERCE DOMAIN</text>
        <rect y="22" width="544" height="88" rx="10" fill="#263832"/>
        <text x="20" y="50" fill="#fff" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700">Mission → filter → complete carts → rank → proof</text>
        <text x="20" y="73" fill="#aebdb7" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="12">Compatibility · stock · pickup · one location · budget</text>
        <rect x="420" y="41" width="100" height="29" rx="14" fill="#b7f522"/>
        <text x="470" y="60" text-anchor="middle" fill="#0e4b3b" font-family="SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">EXPLAINABLE</text>
      </g>

      <g transform="translate(28 309)">
        <text fill="#dcece5" font-family="SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.4">03 · CHECKOUT + STATE</text>
        <rect y="22" width="330" height="80" rx="10" fill="#263832"/>
        <text x="20" y="51" fill="#fff" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700">Recheck · mandate · confirm</text>
        <text x="20" y="74" fill="#aebdb7" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11">Nonce · hash · expiry · idempotency</text>
        <rect x="350" y="22" width="194" height="80" rx="10" fill="#dcece5"/>
        <ellipse cx="447" cy="45" rx="52" ry="13" fill="#0e4b3b"/>
        <path d="M395 45v31c0 8 23 14 52 14s52-6 52-14V45" fill="#0e4b3b"/>
        <text x="447" y="67" text-anchor="middle" fill="#dcece5" font-family="SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">SQLITE</text>
        <text x="447" y="94" text-anchor="middle" fill="#4e5f58" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="10">atomic order + inventory</text>
      </g>
    </g>

    <line x1="1020" y1="188" x2="1090" y2="188" stroke="#b7f522" stroke-width="3" marker-end="url(#signal-arrow)"/>
    <line x1="1020" y1="368" x2="1090" y2="368" stroke="#83958e" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(1100)">
      <text x="0" y="0" fill="#7b8782" font-family="SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.7">OUTCOMES + BOUNDARY</text>
      <rect y="32" width="340" height="236" rx="20" fill="#fff" stroke="#d8d0c4" stroke-width="2"/>
      <circle cx="42" cy="74" r="18" fill="#dcece5"/>
      <path d="M34 74l6 6 11-14" fill="none" stroke="#0e4b3b" stroke-width="4" stroke-linecap="round"/>
      <text x="72" y="79" fill="#0e4b3b" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="24" font-weight="600">User-visible result</text>
      <text x="30" y="119" fill="#5f6964" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14">
        <tspan x="30">Ranked carts and compatibility proof</tspan>
        <tspan x="30" dy="24">Exact merchant, items, total, and expiry</tspan>
        <tspan x="30" dy="24">Pickup receipt only after user confirmation</tspan>
      </text>
      <rect x="30" y="188" width="280" height="30" rx="15" fill="#dcece5"/>
      <text x="170" y="208" text-anchor="middle" fill="#2d6253" font-family="SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">PRIVATE NONCE STAYS OUT OF MODEL VIEW</text>

      <rect y="290" width="340" height="166" rx="20" fill="#1545e8"/>
      <text x="30" y="334" fill="#fff" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="25" font-weight="600">Simulated Visa adapter</text>
      <text x="30" y="365" fill="#dce4ff" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="13">
        <tspan x="30">Approval · decline · failure · reversal</tspan>
        <tspan x="30" dy="23">No credentials. No network call. No live charge.</tspan>
      </text>
      <rect x="30" y="410" width="280" height="25" rx="12" fill="#fff" fill-opacity=".14"/>
      <text x="170" y="427" text-anchor="middle" fill="#fff" font-family="SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">PAYMENT_MODE MUST EQUAL “simulated”</text>
    </g>
  </g>

  <g transform="translate(72 758)">
    <line x1="0" y1="0" x2="1440" y2="0" stroke="#d8d0c4" stroke-width="2"/>
    <text y="43" fill="#0e4b3b" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700">Trust boundary:</text>
    <text x="120" y="43" fill="#5f6964" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15">the AI can recommend; a direct user action must confirm merchant + cart version + amount + expiry.</text>
    <text x="1440" y="43" text-anchor="end" fill="#8a928e" font-family="SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">TYPESCRIPT · REACT · MCP APPS · EXPRESS · NODE SQLITE</text>
  </g>
</svg>
