<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MissionCart Devpost cover</title>
  <desc id="desc">One mission. One mission-ready cart.</desc>
  <defs>
    <clipPath id="frame"><rect width="1600" height="900" rx="38"/></clipPath>
    <linearGradient id="shade" x1="0" x2="1">
      <stop offset="0" stop-color="#112d24"/>
      <stop offset=".66" stop-color="#112d24"/>
      <stop offset="1" stop-color="#112d24" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="#f6f1e7"/>
    <image href="../brand/missioncart-kit-concept.png" x="560" width="1040" height="900" preserveAspectRatio="xMidYMid slice"/>
    <path d="M0 0h930L760 900H0Z" fill="#112d24"/>
    <rect x="0" y="0" width="1030" height="900" fill="url(#shade)"/>
    <g transform="translate(86 72)">
      <rect width="58" height="58" rx="13" fill="#c6f65b"/>
      <path d="M17 22h24l-2 21H19L17 22Z" fill="#112d24"/>
      <path d="M23 24v-4c0-5 3-8 6-8s6 3 6 8v4M24 32c3 3 7 3 10 0" fill="none" stroke="#c6f65b" stroke-width="3" stroke-linecap="round"/>
      <text x="78" y="26" fill="#fff" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="23" font-weight="800" letter-spacing="4">MISSIONCART</text>
      <text x="80" y="50" fill="#a9bbb4" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3">LIFEHACK 2026 · COMMERCE PROTOTYPE</text>
    </g>
    <g transform="translate(86 252)">
      <rect width="270" height="34" rx="17" fill="#c6f65b"/>
      <text x="135" y="23" fill="#112d24" text-anchor="middle" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="2">CHAT → CART → CONFIRM</text>
      <text y="112" fill="#fff" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700">One mission.</text>
      <text y="198" fill="#fff" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700">One mission-ready cart.</text>
      <text y="270" fill="#cbd8d3" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="25">Complete, compatible, pickup-ready—then one exact,</text>
      <text y="305" fill="#cbd8d3" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="25">explicit confirmation.</text>
      <g transform="translate(0 382)">
        <text x="0" y="0" fill="#fff" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="3">SIN</text>
        <line x1="58" y1="-7" x2="228" y2="-7" stroke="#587269" stroke-width="2"/>
        <circle cx="143" cy="-7" r="8" fill="#c6f65b"/>
        <text x="252" y="0" fill="#fff" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="3">TYO</text>
        <rect x="355" y="-29" width="236" height="44" rx="22" fill="#1d3fd4"/>
        <text x="473" y="-1" fill="#fff" text-anchor="middle" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2">VISA RAIL · SIMULATED</text>
      </g>
    </g>
    <text x="86" y="838" fill="#8ea39b" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">NO CARD DATA · SEEDED MERCHANTS · NO LIVE CHARGE</text>
  </g>
</svg>
