<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Woven Devpost cover</title>
  <desc id="desc">Everything a user needs, woven into one complete compatible cart.</desc>
  <defs>
    <clipPath id="frame"><rect width="1600" height="900" rx="38"/></clipPath>
    <linearGradient id="imageFade" x1="0" x2="1">
      <stop offset="0" stop-color="#0e4b3b"/>
      <stop offset=".48" stop-color="#0e4b3b" stop-opacity=".96"/>
      <stop offset="1" stop-color="#0e4b3b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="#f4eee4"/>
    <image href="../brand/woven-hero-flightpath.png" x="500" width="1100" height="900" preserveAspectRatio="xMidYMid slice"/>
    <path d="M0 0h930L750 900H0Z" fill="#0e4b3b"/>
    <rect x="500" width="610" height="900" fill="url(#imageFade)"/>
    <path d="M1245-30c-80 155-36 294 92 383s112 250 12 378" fill="none" stroke="#b7f522" stroke-width="10" stroke-linecap="round" opacity=".9"/>

    <g transform="translate(84 70)">
      <image href="../brand/woven-mark.svg" width="58" height="58"/>
      <text x="78" y="28" fill="#fff" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="5">WOVEN</text>
      <text x="80" y="51" fill="#b9cbc4" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3">LIFEHACK 2026 · AGENTIC COMMERCE</text>
    </g>

    <g transform="translate(84 240)">
      <rect width="318" height="36" rx="18" fill="#b7f522"/>
      <text x="159" y="24" fill="#0e4b3b" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="2">ONE REQUEST → ONE COMPLETE CART</text>
      <text y="116" fill="#fff" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="85" font-weight="600" letter-spacing="-3">Everything you need.</text>
      <text y="208" fill="#b7f522" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="85" font-style="italic" font-weight="500" letter-spacing="-3">Woven into one choice.</text>
      <text y="278" fill="#c3d0cb" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="24">Complete, compatible carts inside ChatGPT and Codex.</text>
      <text y="315" fill="#c3d0cb" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="24">Nothing moves until the user confirms the exact terms.</text>
      <g transform="translate(0 395)">
        <text y="4" fill="#fff" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="3">SIN</text>
        <line x1="60" y1="-3" x2="232" y2="-3" stroke="#6d7974" stroke-width="2"/>
        <circle cx="60" cy="-3" r="8" fill="#b7f522"/>
        <circle cx="232" cy="-3" r="10" fill="#fcfaf5"/>
        <circle cx="232" cy="-3" r="6" fill="#1545e8"/>
        <text x="256" y="4" fill="#fff" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="3">TYO</text>
        <rect x="360" y="-27" width="244" height="46" rx="23" fill="#1545e8"/>
        <text x="482" y="2" fill="#fff" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2">VISA RAIL · SIMULATED</text>
      </g>
    </g>
    <text x="84" y="840" fill="#8fa39b" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">SEEDED MERCHANTS · NO CARD DATA · NO LIVE CHARGE</text>
  </g>
</svg>
