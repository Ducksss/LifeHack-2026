<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 1600 900"><title id="title">Woven architecture</title><desc id="desc">A request moves through ChatGPT or Codex into Woven, then crosses an explicit user confirmation boundary before a simulated Visa authorization.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#71847d" d="M0 0 10 5 0 10Z"/></marker></defs><rect width="1600" height="900" fill="#f4eee4" rx="38"/><path fill="none" stroke="#b7f522" stroke-width="7" d="M1210-30c-90 158-38 286 92 372s124 254 8 385" opacity=".65"/><text x="88" y="88" fill="#0e4b3b" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="4">WOVEN / SYSTEM STORY</text><text x="88" y="162" fill="#0e4b3b" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="58" font-weight="600" letter-spacing="-2">The AI can recommend. Only you can authorize.</text><text x="88" y="205" fill="#596b64" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="21">Five clear steps, one service, and a hard consent boundary before payment.</text><g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif"><g transform="translate(88 308)"><rect width="248" height="238" fill="#fcfaf5" stroke="#d2c9bc" stroke-width="2" rx="8"/><circle cx="50" cy="52" r="24" fill="#dcece5"/><text x="50" y="60" fill="#0e4b3b" font-size="21" font-weight="900" text-anchor="middle">1</text><text x="28" y="112" fill="#0e4b3b" font-size="23" font-weight="800">Ask naturally</text><text x="28" y="158" fill="#67756f" font-size="16">Campers · weather</text><text x="28" y="184" fill="#67756f" font-size="16">car space · budget</text><text x="28" y="216" fill="#6f990d" font-size="12" font-weight="800" letter-spacing="2">INTENT</text></g><line x1="352" x2="398" y1="427" y2="427" stroke="#71847d" stroke-width="3" marker-end="url(#arrow)"/><g 