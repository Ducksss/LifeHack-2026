" letter-spacing="2">HARD BOUNDARY</text></g><line x1="1330" x2="1376" y1="427" y2="427" stroke="#1545e8" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(1392 308)"><rect width="120" height="238" fill="#1545e8" rx="8"/><circle cx="38" cy="52" r="24" fill="#fff"/><text x="38" y="60" fill="#1545e8" font-size="21" font-weight="900" text-anchor="middle">5</text><text x="22" y="112" fill="#fff" font-family="Georgia, serif" font-size="24" font-weight="700">VISA</text><text x="22" y="143" fill="#fff" font-size="14" font-weight="800">SIMULATOR</text><text x="22" y="181" fill="#dce4ff" font-size="13">Authorize</text><text x="22" y="202" fill="#dce4ff" font-size="13">or reverse</text></g><g transform="translate(414 648)"><rect width="900" height="118" fill="#dff1eb" stroke="#a7d8cb" stroke-width="2" rx="8"/><text x="32" y="42" fill="#0e4b3b" font-size="13" font-weight="800" letter-spacing="3">MERCHANT OPERATIONS LOOP</text><text x="32" y="79" fill="#0e4b3b" font-size="20" font-weight="700">Inventory + prices + controlled failure scenarios</text><text x="570" y="79" fill="#596b64" font-size="15">Audit trail · SQLite · HTTP + stdio MCP</text><path stroke="#71847d" stroke-dasharray="7 8" stroke-width="3" d="M450 0V-74"/></g></g><line x1="88" x2="1512" y1="810" y2="810" stroke="#d2c9bc" stroke-width="2"/><text x="88" y="851" fill="#63756d" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">PROTOTYPE: SEEDED MERCHANTS · SIMULATED VISA AUTHORIZATION · NO LIVE CHARGE</text></svg>