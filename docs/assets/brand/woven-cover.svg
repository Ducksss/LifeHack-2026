    <text x="84" y="840" fill="#91a59d" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">SEEDED MERCHANTS · NO CARD DATA · NO LIVE CHARGE</text>
