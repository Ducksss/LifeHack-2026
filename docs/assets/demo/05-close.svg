<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Woven demo closing card</title>
  <desc id="desc">Ask once. Review once. Confirm once.</desc>
  <rect width="1600" height="900" fill="#0e4b3b"/>
  <circle cx="1510" cy="-20" r="340" fill="none" stroke="#b7f522" stroke-width="3" opacity="0.5"/>
  <circle cx="1510" cy="-20" r="250" fill="none" stroke="#dcece5" stroke-width="3" opacity="0.35"/>
  <image href="../brand/woven-wordmark.svg" x="90" y="74" width="440" height="122"/>
  <rect x="90" y="254" width="248" height="42" rx="21" fill="#b7f522"/>
  <text x="214" y="281" text-anchor="middle" fill="#0e4b3b" font-family="Avenir Next, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1.8">THE REQUEST FINISHES HERE</text>
  <text x="90" y="406" fill="#fcfaf5" font-family="Iowan Old Style, Georgia, serif" font-size="78" font-weight="700">Ask once.</text>
  <text x="90" y="496" fill="#b7f522" font-family="Iowan Old Style, Georgia, serif" font-size="78" font-style="italic" font-weight="700">Review once.</text>
  <text x="90" y="586" fill="#fcfaf5" font-family="Iowan Old Style, Georgia, serif" font-size="78" font-weight="700">Confirm once.</text>
  <line x1="92" y1="654" x2="1496" y2="654" stroke="#547c70"/>
  <text x="90" y="718" fill="#dcece5" font-family="Avenir Next, Arial, sans-serif" font-size="26">ChatGPT understands the request.</text>
  <text x="90" y="758" fill="#dcece5" font-family="Avenir Next, Arial, sans-serif" font-size="26">Woven builds the right cart. The user controls authorization.</text>
  <circle cx="1140" cy="724" r="8" fill="#b7f522"/>
  <line x1="1153" y1="724" x2="1270" y2="724" stroke="#6f968b" stroke-width="3"/>
  <circle cx="1283" cy="724" r="10" fill="#fcfaf5"/>
  <circle cx="1283" cy="724" r="6" fill="#1545e8"/>
  <text x="1278" y="731" fill="#fcfaf5" font-family="SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.4">RAIN → READY</text>
  <text x="90" y="838" fill="#9db7ae" font-family="SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.8">SEEDED INVENTORY · SIMULATED VISA AUTHORIZATION · NO LIVE CHARGE</text>
</svg>
