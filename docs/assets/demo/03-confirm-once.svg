<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" aria-labelledby="title desc" role="img" viewBox="0 0 1600 900"><title id="title">Woven demo fallback — Confirm once</title><desc id="desc">A successful simulated Visa result and pickup-ready receipt.</desc><defs><clipPath id="screen"><rect width="1280" height="720" x="288" y="72" rx="18"/></clipPath></defs><rect width="1600" height="900" fill="#f4eee4"/><rect width="256" height="900" fill="#0e4b3b"/><image width="56" height="56" x="32" y="32" href="../brand/woven-mark.svg"/><text x="104" y="55" fill="#fcfaf5" font-family="Avenir Next, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="4">WOVEN</text><text x="104" y="78" fill="#dcece5" font-family="SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.8">STAGE FALLBACK</text><text x="32" y="206" fill="#b7f522" font-family="Iowan Old Style, Georgia, serif" font-size="76" font-weight="700">03</text><text x="32" y="258" fill="#fcfaf5" font-family="Avenir Next, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2.6">CONFIRM ONCE</text><text x="32" y="310" fill="#dcece5" font-family="Iowan Old Style, Georgia, serif" font-size="28" font-weight="700">Your yes is</text><text x="32" y="344" fill="#dcece5" font-family="Iowan Old Style, Georgia, serif" font-size="28" font-weight="700">the final</text><text x="32" y="378" fill="#dcece5" font-family="Iowan Old Style, Georgia, serif" font-size="28" font-weight="700">thread.</text><line x1="32" x2="224" y1="422" y2="422" stroke="#547c70"/><text x="32" y="462" fill="#fcfaf5" font-family="Avenir Next, Arial, sans-serif" font-size="15" font-weight="700">KIT RESERVED</text><text x="32" y="501" fill="#fcfaf5" font-family="Avenir Next, Arial, sans-serif" font-size="15" font-weight="700">PICKUP RECEIPT</text><text x="32" y="540" fill="#fcfaf5" font-family="Avenir Next, Arial, sans-serif" font-size="15" font-weight="700">IDEMPOTENT ORDER</text><text x="32" y="579" fill="#fcfaf5" font-family="Avenir Next, Arial, sans-serif" font-size="15" font-weight="700">NO CARD DATA</text><text x="32" y="825" fill="#b7f522" font-family="SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.5">SIMULATED VISA</text><text x="32" y="842" fill="#b7f522" font-family="SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.5">NO LIVE CHARGE</text><text x="288" y="43" fill="#0e4b3b" font-family="Avenir Next, Arial, sans-serif" font-size="21" font-weight="800">Kit reserved. Everything aligned.</text><rect width="1280" height="720" x="288" y="72" fill="#fcfaf5" stroke="#c8d2cd" rx="18"/><image width="1280" height="720" x="288" y="72" clip-path="url(#screen)" href="../screenshots/order-success.png" preserveAspectRatio="xMidYMid meet"/><circle cx="300" cy="840" r="6" fill="#b7f522"/><text x="320" y="846" fill="#0e4b3b" font-family="Avenir Next, Arial, sans-serif" font-size="17" font-weight="700">A simulated authorization produces a pickup-ready result. No live charge occurs.</text></svg>