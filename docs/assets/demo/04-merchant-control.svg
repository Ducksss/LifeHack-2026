<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Woven demo fallback — Merchant control</title>
  <desc id="desc">The merchant desk with inventory, scenarios, orders, and audit controls.</desc>
  <defs>
    <clipPath id="screen"><rect x="288" y="72" width="1280" height="720" rx="18"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="#f4eee4"/>
  <rect width="256" height="900" fill="#0e4b3b"/>
  <image href="../brand/woven-mark.svg" x="32" y="32" width="56" height="56"/>
  <text x="104" y="55" fill="#fcfaf5" font-family="Avenir Next, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="4">WOVEN</text>
  <text x="104" y="78" fill="#dcece5" font-family="SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.8">STAGE FALLBACK</text>
  <text x="32" y="206" fill="#b7f522" font-family="Iowan Old Style, Georgia, serif" font-size="76" font-weight="700">04</text>
  <text x="32" y="258" fill="#fcfaf5" font-family="Avenir Next, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2.6">MERCHANT</text>
  <text x="32" y="284" fill="#fcfaf5" font-family="Avenir Next, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2.6">CONTROL</text>
  <text x="32" y="342" fill="#dcece5" font-family="Iowan Old Style, Georgia, serif" font-size="28" font-weight="700">Test the trust</text>
  <text x="32" y="376" fill="#dcece5" font-family="Iowan Old Style, Georgia, serif" font-size="28" font-weight="700">boundary live.</text>
  <line x1="32" y1="422" x2="224" y2="422" stroke="#547c70"/>
  <text x="32" y="462" fill="#fcfaf5" font-family="Avenir Next, Arial, sans-serif" font-size="15" font-weight="700">PRICE + STOCK</text>
  <text x="32" y="501" fill="#fcfaf5" font-family="Avenir Next, Arial, sans-serif" font-size="15" font-weight="700">AUTH DECLINE</text>
  <text x="32" y="540" fill="#fcfaf5" font-family="Avenir Next, Arial, sans-serif" font-size="15" font-weight="700">REVERSAL</text>
  <text x="32" y="579" fill="#fcfaf5" font-family="Avenir Next, Arial, sans-serif" font-size="15" font-weight="700">AUDIT TRAIL</text>
  <text x="32" y="825" fill="#b7f522" font-family="SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.5">SEEDED MERCHANT DATA</text>
  <text x="32" y="842" fill="#b7f522" font-family="SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.5">SIMULATED OUTCOMES</text>
  <text x="288" y="43" fill="#0e4b3b" font-family="Avenir Next, Arial, sans-serif" font-size="21" font-weight="800">Merchants control what the AI can sell</text>
  <rect x="288" y="72" width="1280" height="720" rx="18" fill="#fcfaf5" stroke="#c8d2cd"/>
  <image href="../screenshots/merchant-dashboard.png" x="288" y="72" width="1280" height="720" preserveAspectRatio="xMidYMid meet" clip-path="url(#screen)"/>
  <circle cx="300" cy="840" r="6" fill="#1545e8"/>
  <text x="320" y="846" fill="#0e4b3b" font-family="Avenir Next, Arial, sans-serif" font-size="17" font-weight="700">Change demo conditions and inspect exact orders without changing code.</text>
