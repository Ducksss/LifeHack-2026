:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),

  background-position:

  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {

  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input:disabled {

  pointer-events: none;
}

  cursor: not-allowed;

.form-switch .form-check-input:disabled,

.form-range::-moz-range-track {

}

.form-range::-moz-range-thumb {

.form-range:focus-visible::-moz-range-thumb {

.form-range:disabled {

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;woven-target-architecture&quot;);
      if (!root) return;

      const flows = {
        recommendation: {
          steps: [
            [&quot;User → Codex&quot;, &quot;Ask once.&quot;, &quot;The host keeps the original request and chooses Woven&#x27;s model-visible entry tool.&quot;],
            [&quot;Codex → Woven MCP&quot;, &quot;Call start_mission.&quot;, &quot;Streamable HTTP or stdio carries a validated MCP tools/call JSON envelope.&quot;],
            [&quot;Woven → merchant services&quot;, &quot;Fetch candidate offers.&quot;, &quot;Merchant MCP/catalog APIs supply current products, price, stock, pickup, and substitutions.&quot;],
            [&quot;Woven domain&quot;, &quot;Build complete carts.&quot;, &quot;Hard constraints run before ranking: compatibility, quantity, one location, budget, volume, stock, pickup.&quot;],
            [&quot;Woven → Codex&quot;, &quot;Return text + structuredContent.&quot;, &quot;Codex shows the summary and opens the full Choice Center inside the MCP App.&quot;]
          ],
          requestLabel: &quot;Codex → Woven&quot;,
          requestMeta: &quot;actual tool contract&quot;,
          request: `{
  &quot;name&quot;: &quot;start_mission&quot;,
  &quot;arguments&quot;: {
    &quot;request&quot;: &quot;Complete rainy-weekend camping kit for 2&quot;,
    &quot;budgetCents&quot;: 30000,
    &quot;campers&quot;: 2,
    &quot;pickupDate&quot;: &quot;2026-08-30&quot;
  }
}`,
          responseLabel: &quot;Woven → Codex&quot;,
          responseMeta: &quot;model + app result&quot;,
          response: `{
  &quot;content&quot;: [{
    &quot;type&quot;: &quot;text&quot;,
    &quot;text&quot;: &quot;Built 5 compatible carts under S$300.&quot;
  }],
  &quot;structuredContent&quot;: {
    &quot;view&quot;: {
      &quot;mission&quot;: { &quot;currency&quot;: &quot;SGD&quot; },
      &quot;carts&quot;: [{
        &quot;merchantName&quot;: &quot;TrailHaus&quot;,
        &quot;totalCents&quot;: 23100
      }]
    }
  }
}`,
          guardTitle: &quot;Boundary&quot;,
          guard: &quot;Visa is intentionally absent from product discovery. Recommendations come from merchant data plus Woven&#x27;s compatibility rules.&quot;
        },
        consent: {
          steps: [
            [&quot;User → MCP App&quot;, &quot;Choose one server cart.&quot;, &quot;App-only select_cart persists the chosen cart; the model cannot silently choose or buy.&quot;],
            [&quot;Woven → merchant&quot;, &quot;Revalidate exact terms.&quot;, &quot;Fresh price, stock, cart version, merchant, location, and amount must still match.&quot;],
            [&quot;Woven checkout guard&quot;, &quot;Mint an expiring mandate.&quot;, &quot;The exact terms are hashed; a one-time nonce travels only in private _meta to the widget.&quot;],
            [&quot;User → Visa Passkey&quot;, &quot;Authenticate the instruction.&quot;, &quot;A direct action launches device-bound authentication for the exact merchant and amount.&quot;],
            [&quot;Woven adapter → Visa VIC&quot;, &quot;Submit the authenticated instruction.&quot;, &quot;Visa can validate later credential requests and network authorization against that instruction.&quot;]
          ],
          requestLabel: &quot;Widget → Woven&quot;,
          requestMeta: &quot;actual app-only contract&quot;,
          request: `{
  &quot;name&quot;: &quot;confirm_purchase&quot;,
  &quot;arguments&quot;: {
    &quot;previewId&quot;: &quot;prv_…&quot;,
    &quot;mandateHash&quot;: &quot;sha256:…&quot;,
    &quot;confirmationNonce&quot;: &quot;private-widget-only&quot;,
    &quot;idempotencyKey&quot;: &quot;checkout_…&quot;
  }
}`,
          responseLabel: &quot;Woven adapter → Visa&quot;,
          responseMeta: &quot;illustrative target contract&quot;,
          response: `{
  &quot;paymentInstruction&quot;: {
    &quot;merchantRef&quot;: &quot;merchant_…&quot;,
    &quot;amount&quot;: { &quot;value&quot;: &quot;231.00&quot;, &quot;currency&quot;: &quot;SGD&quot; },
    &quot;cartHash&quot;: &quot;sha256:…&quot;,
    &quot;expiresAt&quot;: &quot;2026-08-30T05:10:00Z&quot;
  },
  &quot;authentication&quot;: {
    &quot;method&quot;: &quot;visa-payment-passkey&quot;,
    &quot;resultRef&quot;: &quot;server-only&quot;
  }
}`,
          guardTitle: &quot;Secrets&quot;,
          guard: &quot;Passkey results, token references, identity sessions, and payment credentials stay server-side. The model sees none of them.&quot;
        },
        completion: {
          steps: [
            [&quot;Woven → Visa VIC/VTS&quot;, &quot;Retrieve instruction-bound credentials.&quot;, &quot;Visa checks that merchant and amount align with the authenticated payment instruction.&quot;],
            [&quot;Woven → merchant checkout&quot;, &quot;Place the exact order.&quot;, &quot;The server supplies the permitted credential to the merchant or PSP without exposing it to Codex or the widget.&quot;],
            [&quot;Merchant / PSP → VisaNet&quot;, &quot;Authorize under network controls.&quot;, &quot;Merchant identity and amount must match the instruction-bound constraints.&quot;],
            [&quot;Merchant → Woven&quot;, &quot;Return order outcome.&quot;, &quot;Order success, decline, or merchant failure flows back to the same idempotent transaction boundary.&quot;],
            [&quot;Woven → Visa VIC&quot;, &quot;Publish commerce signal.&quot;, &quot;The outcome is associated with the original instruction for traceability and dispute support.&quot;],
            [&quot;Woven → Codex&quot;, &quot;Render status and receipt.&quot;, &quot;The MCP result updates structuredContent; the Choice Center shows the order and receipt in-chat.&quot;]
          ],
          requestLabel: &quot;Server-side checkout&quot;,
          requestMeta: &quot;credential never enters MCP&quot;,
          request: `{
  &quot;merchantCheckout&quot;: {
    &quot;cartId&quot;: &quot;cart_…&quot;,
    &quot;amountCents&quot;: 23100,
    &quot;currency&quot;: &quot;SGD&quot;,
    &quot;idempotencyKey&quot;: &quot;checkout_…&quot;,
    &quot;paymentCredentialRef&quot;: &quot;server-only&quot;
  }
}`,
          responseLabel: &quot;Woven → Codex&quot;,
          responseMeta: &quot;safe result&quot;,
          response: `{
  &quot;content&quot;: [{
    &quot;type&quot;: &quot;text&quot;,
    &quot;text&quot;: &quot;Order ord_… confirmed for S$231.00.&quot;
  }],
  &quot;structuredContent&quot;: {
    &quot;view&quot;: {
      &quot;order&quot;: {
        &quot;status&quot;: &quot;confirmed&quot;,
        &quot;receiptNumber&quot;: &quot;WV-…&quot;
      }
    }
  }
}`,
          guardTitle: &quot;Output&quot;,
          guard: &quot;Codex receives only user-safe status. Card data, tokens, passkey assertions, and the private confirmation nonce never appear in model-visible content.&quot;
        },
        failure: {
          steps: [
            [&quot;Woven ↔ merchant&quot;, &quot;Revalidate twice.&quot;, &quot;A price, stock, or cart-version change invalidates the preview before any payment attempt.&quot;],
            [&quot;Checkout guard&quot;, &quot;Reject bad consent.&quot;, &quot;Missing identity, expired mandate, wrong nonce, or a changed hash fails closed.&quot;],
            [&quot;Visa / PSP → Woven&quot;, &quot;Decline without an order.&quot;, &quot;An authorization decline creates no confirmed merchant order and decrements no inventory.&quot;],
            [&quot;Merchant → Woven&quot;, &quot;Reverse post-authorization failure.&quot;, &quot;If authorization succeeds but merchant order creation fails, the state enters reversal.&quot;],
            [&quot;Woven store&quot;, &quot;Make retries idempotent.&quot;, &quot;The same idempotency key returns the original result and cannot decrement stock twice.&quot;],
            [&quot;Woven → Codex&quot;, &quot;Return a safe, actionable error.&quot;, &quot;The user sees whether to refresh, retry, or choose another cart; secrets and raw processor errors remain hidden.&quot;]
          ],
          requestLabel: &quot;Stale checkout&quot;,
          requestMeta: &quot;example safe error&quot;,
          request: `{
  &quot;error&quot;: {
    &quot;code&quot;: &quot;CART_STALE&quot;,
    &quot;message&quot;: &quot;Price or inventory changed. Review a new checkout preview.&quot;,
    &quot;retryable&quot;: true
  }
}`,
          responseLabel: &quot;State outcomes&quot;,
          responseMeta: &quot;atomic + idempotent&quot;,
          response: `price / stock changed → no payment

Visa decline → no confirmed order

merchant failed after auth → reversal

duplicate idempotency key → original order

success → one stock decrement + one receipt`,
          guardTitle: &quot;Fail closed&quot;,
          guard: &quot;No payment path bypasses exact-term confirmation. Recovery always creates a new preview rather than mutating an already-authorized mandate.&quot;
        }
      };

      const steps = root.querySelector(&quot;#wa-steps&quot;);
      const requestLabel = root.querySelector(&quot;#wa-request-label&quot;);
      const responseLabel = root.querySelector(&quot;#wa-response-label&quot;);
      const requestCode = root.querySelector(&quot;#wa-request-code&quot;);
      const responseCode = root.querySelector(&quot;#wa-response-code&quot;);
      const guardTitle = root.querySelector(&quot;#wa-guard-title&quot;);
      const guardCopy = root.querySelector(&quot;#wa-guard-copy&quot;);
      const flowButtons = [...root.querySelectorAll(&quot;[data-flow]&quot;)];
      const loopButton = root.querySelector(&quot;[data-loop]&quot;);
      let activeIndex = 0;
      let loopTimer;

      const render = (key) =&gt; {
        const flow = flows[key];
        if (!flow || !steps || !requestLabel || !responseLabel || !requestCode || !responseCode || !guardTitle || !guardCopy) return;

        steps.innerHTML = flow.steps.map((step, index) =&gt; `
          &lt;li class=&quot;wa-step&quot;&gt;
            &lt;span class=&quot;wa-step-number text-small&quot;&gt;${index + 1}&lt;/span&gt;
            &lt;div&gt;
              &lt;span class=&quot;wa-step-actor text-small&quot;&gt;${step[0]}&lt;/span&gt;
              &lt;strong&gt;${step[1]}&lt;/strong&gt;
              &lt;p class=&quot;text-small&quot;&gt;${step[2]}&lt;/p&gt;
            &lt;/div&gt;
          &lt;/li&gt;`).join(&quot;&quot;);

        requestLabel.textContent = flow.requestLabel;
        requestLabel.nextElementSibling.textContent = flow.requestMeta;
        responseLabel.textContent = flow.responseLabel;
        responseLabel.nextElementSibling.textContent = flow.responseMeta;
        requestCode.textContent = flow.request;
        responseCode.textContent = flow.response;
        guardTitle.textContent = flow.guardTitle;
        guardCopy.textContent = flow.guard;

        root.querySelectorAll(&quot;[data-flow]&quot;).forEach((button) =&gt; {
          const selected = button.getAttribute(&quot;data-flow&quot;) === key;
          button.setAttribute(&quot;aria-pressed&quot;, String(selected));
          button.classList.toggle(&quot;btn-primary&quot;, selected);
          if (selected) activeIndex = flowButtons.indexOf(button);
        });
      };

      const stopLoop = () =&gt; {
        window.clearInterval(loopTimer);
        loopTimer = undefined;
        loopButton.textContent = &quot;▶ Play loop&quot;;
        loopButton.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
      };

      const startLoop = () =&gt; {
        loopTimer = window.setInterval(() =&gt; {
          activeIndex = (activeIndex + 1) % flowButtons.length;
          render(flowButtons[activeIndex].getAttribute(&quot;data-flow&quot;));
        }, 4_000);
        loopButton.textContent = &quot;Ⅱ Pause loop&quot;;
        loopButton.setAttribute(&quot;aria-pressed&quot;, &quot;true&quot;);
      };

      flowButtons.forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          render(button.getAttribute(&quot;data-flow&quot;));
          stopLoop();
        });
      });

      loopButton.addEventListener(&quot;click&quot;, () =&gt; loopTimer ? stopLoop() : startLoop());
      if (!window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches) startLoop();
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
